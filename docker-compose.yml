services:
  db:
    image: postgres:16-alpine
    container_name: ms-reportes-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ms_reportes
      POSTGRES_USER: reportes_user
      POSTGRES_PASSWORD: reportes_secret_pass
    ports:
      - "5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reportes_user -d ms_reportes"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data_v2:/var/lib/postgresql/data
    networks:
      - ms-reportes-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-reportes-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: 3011
      # CAMBIO CRÍTICO: Cambiamos '@db:5432' por '@ms-reportes-db:5432'
      DATABASE_URL: postgresql://reportes_user:reportes_secret_pass@ms-reportes-db:5432/ms_reportes?schema=public
      MS_ENTIDADES_URL: ${MS_ENTIDADES_URL}
      MS_INVENTARIO_URL: ${MS_INVENTARIO_URL}
      MS_AGENDA_URL: ${MS_AGENDA_URL}
      MS_HISTORIA_URL: ${MS_HISTORIA_URL}
      MS_VENTAS_URL: ${MS_VENTAS_URL}
      CACHE_TTL_MINUTES: ${CACHE_TTL_MINUTES:-5}
      SNAPSHOT_INTERVAL_MINUTES: ${SNAPSHOT_INTERVAL_MINUTES:-15}
      MAX_DATE_RANGE_DAYS: ${MAX_DATE_RANGE_DAYS:-366}
    ports:
      - "3011:3011"
    networks:
      - ms-reportes-net
      - ms_inventario_ms-inventario-net

volumes:
  postgres_data_v2:

networks:
  ms-reportes-net:
    driver: bridge
  ms_inventario_ms-inventario-net:
    external: true